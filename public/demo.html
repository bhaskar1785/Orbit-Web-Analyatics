<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orbit tracker demo</title>
    <style>
      body {
        margin: 0;
        min-height: 140vh;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 60px 24px;
      }
      main {
        max-width: 700px;
        margin: 0 auto;
      }
      button {
        margin: 8px 8px 8px 0;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #7c3aed;
        color: white;
      }
      a {
        color: #a78bfa;
      }
      .spacer {
        height: 700px;
      }
      code {
        background: #1e293b;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>orbit tracker demo</h1>
      <p>
        Dashboard: <a href="https://orbit.omber.space">orbit.omber.space</a>
      </p>
      <p>
        This page loads <code>/tracker.js</code> exactly the way an external site
        would. Move your cursor, click the buttons, scroll, and then open the
        dashboard.
      </p>
      <button id="one">Click me</button>
      <button id="two">Click me too</button>
      <p class="muted">Keep scrolling — scroll depth is tracked too.</p>
      <div class="spacer"></div>
      <p>End of page.</p>
    </main>

    <script>
      var params = new URLSearchParams(location.search)
      var site = params.get('site') || 'my-site'
      var endpoint =
        params.get('endpoint') ||
        'https://us-central1-YOUR_PROJECT.cloudfunctions.net/omberIngest'

      var tracker = document.createElement('script')
      tracker.async = true
      tracker.src = '/tracker.js'
      tracker.setAttribute('data-site-id', site)
      tracker.setAttribute('data-endpoint', endpoint)
      document.head.appendChild(tracker)
    </script>
  </body>
</html>
